# Atlas (Pixelbook Go) speaker voicing as a WirePlumber *smart filter*.
#
# A smart filter only sits between client streams and its target; it is never
# selected as the default sink, so the default stays the raw MAX98373 sink.
# It applies to the built-in speakers only -- headphones/HDMI are untouched.
#
# Curve is the previous "Atlas Speakers" reference preset, rebuilt with
# built-in biquads (no EasyEffects, no extra daemon):
#   high-pass 100 Hz (0.45 mm excursion limit on these drivers)
#   +3 dB @100, +2 dB @160, +1 dB @250, -1.5 dB @500,
#   -1.5 dB @3k, +1.5 dB @8k, +1 dB @12k
# Max combined boost is ~+2.7 dB (160 Hz), so no preamp/limiter node is used;
# the amp-side BDE/DHT protection is already configured by the UCM.

wireplumber.profiles = {
  main = {
    filter.sink.atlas-speaker-eq = required
  }
}

wireplumber.components = [
  {
    name = libpipewire-module-filter-chain, type = pw-module-client
    arguments = {
      node.name        = "filter.sink.atlas-speaker-eq"
      node.description = "Atlas Speaker EQ"
      media.name       = "Atlas Speaker EQ"

      filter.graph = {
        nodes = [
          { type = builtin name = hp    label = bq_highpass control = { "Freq" = 100.0,  "Q" = 0.7071 } }
          { type = builtin name = eq100 label = bq_peaking  control = { "Freq" = 100.0,  "Q" = 1.4, "Gain" =  3.0 } }
          { type = builtin name = eq160 label = bq_peaking  control = { "Freq" = 160.0,  "Q" = 1.4, "Gain" =  2.0 } }
          { type = builtin name = eq250 label = bq_peaking  control = { "Freq" = 250.0,  "Q" = 1.4, "Gain" =  1.0 } }
          { type = builtin name = eq500 label = bq_peaking  control = { "Freq" = 500.0,  "Q" = 1.2, "Gain" = -1.5 } }
          { type = builtin name = eq3k  label = bq_peaking  control = { "Freq" = 3000.0, "Q" = 1.5, "Gain" = -1.5 } }
          { type = builtin name = eq8k  label = bq_peaking  control = { "Freq" = 8000.0, "Q" = 0.9, "Gain" =  1.5 } }
          { type = builtin name = eq12k label = bq_peaking  control = { "Freq" = 12000.0,"Q" = 0.9, "Gain" =  1.0 } }
        ]
        links = [
          { output = "hp:Out",    input = "eq100:In" }
          { output = "eq100:Out", input = "eq160:In" }
          { output = "eq160:Out", input = "eq250:In" }
          { output = "eq250:Out", input = "eq500:In" }
          { output = "eq500:Out", input = "eq3k:In" }
          { output = "eq3k:Out",  input = "eq8k:In" }
          { output = "eq8k:Out",  input = "eq12k:In" }
        ]
      }

      audio.channels = 2
      audio.position = [ FL, FR ]

      capture.props = {
        media.class         = Audio/Sink
        filter.smart        = true
        filter.smart.name   = "filter.sink.atlas-speaker-eq"
        # Target only the internal speakers. The AVS platform instance (18) is
        # stable across boots; card numbering is not, which is why this is a
        # node name and not hw:N.
        filter.smart.target = { node.name = "alsa_output.platform-avs_max98373.18.auto.HiFi__Speaker__sink" }
      }
      playback.props = {
        # Let the real sink suspend when no client is linked to the filter.
        node.passive = true
        media.role   = "DSP"
      }
    }
    provides = filter.sink.atlas-speaker-eq
    requires = [ support.client-context ]
  }
]
