# Atlas / AVS: the MAX98373 SSP link runs at 48 kHz only. Lock the graph to
# 48 kHz so a 44.1 kHz client is resampled once (instead of the graph chasing
# client rates into a hardware that cannot follow), and use the highest
# resampler quality for that single conversion.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    resample.quality            = 10
}
